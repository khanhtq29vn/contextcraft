[project]
name = "contextcraft-ai"
version = "0.3.2"
description = "AST-Aware, Dependency-Graph-Ranked, Token-Budgeted Semantic Codebase Compressor for LLMs"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{ name = "ContextCraft Contributors" }]
keywords = [
  "llm",
  "context-compression",
  "ast",
  "tree-sitter",
  "pagerank",
  "knapsack",
  "repomix",
  "markitdown",
  "code-analysis",
  "ai-engineering",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Software Development :: Compilers",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

dependencies = [
    "ignore-python>=0.4.2",
    "msgspec>=0.22.0",
    "rustworkx>=0.18.1",
    "tiktoken>=0.14.0",
    "tree-sitter>=0.26.0",
    "tree-sitter-python>=0.25.0",
    "tree-sitter-rust>=0.24.2",
]

[project.scripts]
contextcraft = "contextcraft.__main__:run_cli"
contextcraft-ai = "contextcraft.__main__:run_cli"

[project.urls]
Homepage = "https://github.com/khanhtq29vn/contextcraft"
Documentation = "https://khanhtq29vn.github.io/contextcraft/"
Repository = "https://github.com/khanhtq29vn/contextcraft"
Issues = "https://github.com/khanhtq29vn/contextcraft/issues"

[project.optional-dependencies]
web = []
docs = [
    "furo>=2025.12.19",
    "myst-parser>=4.0.1",
    "sphinx>=8.1.3",
    "sphinx-autobuild>=2024.10.3",
    "sphinxcontrib-katex>=0.9.11",
    "sphinxcontrib-mermaid>=2.1.1",
]
dev = []
cli = [
    "cyclopts>=4.25.3",
    "rich>=15.0.0",
]


[dependency-groups]
dev = [
    "pyrefly>=1.4.0",
    "ruff>=0.17.3",
]
[build-system]
requires = ["uv_build>=0.13.6,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "contextcraft"
module-root = ""

[tool.pyrefly]
project-includes = [
    "**/*.py*",
    "**/*.ipynb",
]
