name: Bug Report
description: Report a bug, AST parsing edge case, or token budget discrepancy
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to report an issue in **ContextCraft**!

  - type: input
    id: version
    attributes:
      label: ContextCraft & Python Version
      description: Output of `contextcraft --version` and `python --version`
      placeholder: "contextcraft 0.1.0, Python 3.11.11 on macOS"
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction Steps
      description: Command or Python SDK snippet that triggers the issue
      placeholder: |
        ```bash
        uv run contextcraft . --budget 4k --focus "auth"
        ```
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected vs. Actual Behavior
      description: What did you expect to happen, and what actually occurred?
    validations:
      required: true